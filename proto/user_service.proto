syntax = "proto3";

package user;

option go_package = "github.com/rafixcs/food-shopping-microservicess/services/user-service/internal/infrastructure/grpc/pb;userpb";

service UserService {
  rpc Register(RegisterRequest) returns (UserResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
  rpc GetAddress(GetAddressRequest) returns (AddressResponse);
}

message RegisterRequest {
  string name = 1;
  string email = 2;
  string password = 3;
  string role = 4;
  string phone = 5;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string token = 1;
}

message ValidateTokenRequest {
  string token = 1;
}

message ValidateTokenResponse {
  string user_id = 1;
  string role = 2;
}

message GetAddressRequest {
  string address_id = 1;
}

message AddressResponse {
  string id = 1;
  string user_id = 2;
  string street = 3;
  string city = 4;
  string state = 5;
  string zip = 6;
  bool is_default = 7;
}

message UserResponse {
  string id = 1;
  string name = 2;
  string email = 3;
  string role = 4;
}